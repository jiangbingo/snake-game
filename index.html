<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - OpenCode</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', monospace;
            background-color: #1a1a1a;
            color: #00ff00;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        h1 {
            margin-bottom: 20px;
        }
        
        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        #gameCanvas {
            border: 3px solid #00ff00;
            background-color: #000000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }
        
        #controls {
            display: flex;
            gap: 10px;
        }
        
        button {
            background-color: #00ff00;
            color: #000000;
            border: 2px solid #00ff00;
            padding: 12px 24px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }
        
        button:hover {
            background-color: #33ff33;
            border-color: #33ff33;
        }
        
        button:active {
            background-color: #00cc00;
            border-color: #00cc00;
        }
        
        #score {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .instructions {
            text-align: center;
            color: #00ff00;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 30px;
        }
        
        .instructions kbd {
            background-color: #000000;
            border: 2px solid #00ff00;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            margin: 0 5px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>🐍 SNAKE GAME</h1>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="controls">
            <button id="startBtn" onclick="startGame()">START</button>
            <button id="resetBtn" onclick="resetGame()">RESET</button>
        </div>
        
        <div id="score">Score: 0</div>
    </div>
    
    <div class="instructions">
        <h2>Controls:</h2>
        <p>Press START to play</p>
        <p><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd> <kbd>S</kbd> <kbd>A</kbd> <kbd>D</kbd></p>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = 20;
        const tileSize = canvas.width / tileCount;
        
        let snake = [{x: 10, y: 10}];
        let direction = {x: 1, y: 0};
        let food = {x: 15, y: 10};
        let score = 0;
        let gameRunning = false;
        let animationId;
        
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = '#003300';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0);
                ctx.lineTo(i * tileSize, canvas.height);
                ctx.stroke();
            }
            for (let j = 0; j <= tileCount; j++) {
                ctx.beginPath();
                ctx.moveTo(0, j * tileSize);
                ctx.lineTo(canvas.width, j * tileSize);
                ctx.stroke();
            }
            
            // Draw food
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(food.x * tileSize + 2, food.y * tileSize + 2, tileSize - 4, tileSize - 4);
            
            // Draw snake
            ctx.fillStyle = '#00ff00';
            snake.forEach(segment => {
                ctx.fillRect(segment.x * tileSize + 1, segment.y * tileSize + 1, tileSize - 2, tileSize - 2);
            });
            
            // Draw score
            document.getElementById('score').textContent = 'Score: ' + score;
        }
        
        function update() {
            if (!gameRunning) return;
            
            // Move snake
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
            
            // Check boundaries
            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;
            
            // Check collision with self
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    console.log('[DEBUG] Game Over - Self collision');
                    gameOver();
                    return;
                }
            }
            
            snake.unshift(head);
            
            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                snake.push({...head}); // Grow snake
                generateFood();
                console.log('[DEBUG] Food eaten! Score:', score);
            }
            
            // Remove tail if not eating
            if (head.x !== food.x || head.y !== food.y) {
                snake.pop();
            }
        }
        
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }
        
        function startGame() {
            console.log('[DEBUG] START button clicked');
            console.log('[DEBUG] gameRunning:', gameRunning);
            console.log('[DEBUG] Snake length:', snake.length);
            
            // Cancel existing animation
            if (animationId) {
                console.log('[DEBUG] Canceling existing animation frame:', animationId);
                cancelAnimationFrame(animationId);
            }
            
            // Reset and start
            gameRunning = true;
            snake = [{x: 10, y: 10}];
            direction = {x: 1, y: 0};
            score = 0;
            generateFood();
            draw();
            
            // Start game loop
            function gameLoop() {
                update();
                draw();
                if (gameRunning) {
                    animationId = requestAnimationFrame(gameLoop);
                }
            }
            
            console.log('[DEBUG] Starting game loop...');
            gameLoop();
        }
        
        function resetGame() {
            console.log('[DEBUG] RESET button clicked');
            
            // Cancel existing animation
            if (animationId) {
                console.log('[DEBUG] Canceling animation frame:', animationId);
                cancelAnimationFrame(animationId);
            }
            
            // Reset state
            gameRunning = false;
            snake = [{x: 10, y: 10}];
            direction = {x: 1, y: 0};
            score = 0;
            generateFood();
            draw();
        }
        
        function gameOver() {
            console.log('[DEBUG] Game Over! Final Score:', score);
            gameRunning = false;
            alert('游戏结束！得分：' + score);
        }
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y === 0) {
                        console.log('[DEBUG] Moving UP');
                        direction = {x: 0, y: -1};
                    }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y === 0) {
                        console.log('[DEBUG] Moving DOWN');
                        direction = {x: 0, y: 1};
                    }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x === 0) {
                        console.log('[DEBUG] Moving LEFT');
                        direction = {x: -1, y: 0};
                    }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x === 0) {
                        console.log('[DEBUG] Moving RIGHT');
                        direction = {x: 1, y: 0};
                    }
                    break;
            }
        });
        
        // Button controls
        document.addEventListener('DOMContentLoaded', function() {
            console.log('[DEBUG] DOM Content Loaded');
            console.log('[DEBUG] START button:', document.getElementById('startBtn'));
            console.log('[DEBUG] RESET button:', document.getElementById('resetBtn'));
            
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            if (startBtn) {
                startBtn.addEventListener('click', function(e) {
                    console.log('[DEBUG] START button click event triggered');
                    e.preventDefault();
                    startGame();
                });
                console.log('[DEBUG] START button event listener attached');
            } else {
                console.error('[DEBUG] ERROR: START button not found!');
            }
            
            if (resetBtn) {
                resetBtn.addEventListener('click', function(e) {
                    console.log('[DEBUG] RESET button click event triggered');
                    e.preventDefault();
                    resetGame();
                });
                console.log('[DEBUG] RESET button event listener attached');
            } else {
                console.error('[DEBUG] ERROR: RESET button not found!');
            }
        });
        
        // Initial draw
        console.log('[DEBUG] Initial draw');
        draw();
        
        // Don't auto-start game
        // startGame();  // 删除这行，让用户手动点击 START
        console.log('[DEBUG] Waiting for user to click START...');
    </script>
</body>
</html>
